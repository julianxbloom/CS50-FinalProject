{% extends "layout.html" %}

{% block main %}
    <div class="arrow">
        <a onclick="history.back()">
            <img src="static/icons/arrow.png" width="28" height="28">
        </a>
        <div class="btn-group dropstart" style="position: absolute; top: -6vh; right: 1vh">
            <button class="btn btn-link" data-bs-toggle="dropdown" aria-expanded="false" style="font-size: larger; font-weight: bold">...</button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="/profile?username={{debate_creator}}">Creator's profile</a></li>
                <li><a class="dropdown-item" href="/delete?debate_id={{debate_id}}">Delete or leave</a></li>
            </ul>
        </div>
    </div>

    <div class="chatTitle">
        <p>{{debate_text}}</p>
    </div>

    <div class="chatbox">
        <div id="chatscroll" class="chatscroll">
            {% for chat in chats %}
                {% if chat['id'] == session_id %}
                    <section style="margin-left: auto; margin-right: 1vh; word-break: break-word; background-color: #6369c2;">
                        <p style="margin-left: 1.5vh; margin-right: 1.5vh; text-align: left;">{{chat['message']}}</p>
                    </section>
                {% else %}
                    <section style="margin-left: 1vh; margin-right: auto; word-break: break-word; background-color: #aba5c4;">
                        <p style="margin-left: 1.5vh; margin-right: 1.5vh; text-align: left;">{{chat['message']}}</p>
                    </section>
                    <p style="margin-left: 2vh; margin-bottom: 1.5vh; text-align: left; font-size: smaller;">from {{chat['username']}}</p>
                {% endif %}
            {% endfor %}
        </div>
    </div>
    
    <form action="/chat?q={{debate_id}}" method="post">
        <div class="messageTyping">
            <input name="message" autofocus autocomplete="off" type="text" class="form-control mx-auto w-auto" size="20" placeholder="Message..">
        </div>
    </form>

    <script>
        var objDiv = document.getElementById("chatscroll");
        objDiv.scrollTop = objDiv.scrollHeight;
    </script>
    
{% endblock %}
